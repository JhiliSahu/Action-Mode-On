<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b1b">
  <title>Maze Craze</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f3f5ff;
      background: #080b1b;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(ellipse at 50% 4%, rgba(86, 57, 178, .24), transparent 49%),
        radial-gradient(ellipse at 83% 80%, rgba(28, 156, 179, .1), transparent 40%),
        #080b1b;
    }

    button { font: inherit; }
    .cabinet { width: min(1120px, 100%); }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 3px 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(115, 245, 236, .48);
      border-radius: 13px;
      color: #73f5ec;
      background: rgba(67, 216, 207, .1);
      box-shadow: 0 0 28px rgba(67, 216, 207, .13);
      font-size: 19px;
    }
    .brand-name { font-size: 15px; font-weight: 950; letter-spacing: .15em; text-transform: uppercase; }
    .brand-subtitle { display: block; margin-top: 3px; color: #8490ad; font-size: 9px; font-weight: 800; letter-spacing: .2em; }
    .edition { color: #9298ba; font-size: 10px; font-weight: 850; letter-spacing: .18em; text-transform: uppercase; }

    .stage {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      border: 1px solid rgba(127, 147, 226, .24);
      border-radius: 18px;
      background: #0a1022;
      box-shadow: 0 28px 90px rgba(0, 0, 0, .56), 0 0 70px rgba(89, 84, 212, .1);
    }
    #scene { display: block; width: 100%; height: 100%; }
    .hud { position: absolute; z-index: 1; inset: 18px 20px auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none; }
    .hud-card {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 11px 15px;
      border: 1px solid rgba(160, 173, 235, .19);
      border-radius: 12px;
      background: rgba(8, 11, 28, .79);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .22);
      backdrop-filter: blur(8px);
    }
    .hud-item { display: grid; gap: 3px; min-width: 52px; }
    .hud-label { color: #8892b3; font-size: 8px; font-weight: 900; letter-spacing: .17em; text-transform: uppercase; }
    .hud-value { color: #f7f6ff; font-size: 15px; font-weight: 900; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
    .key-count { color: #ffd26e; }
    .minimap {
      width: 160px;
      min-height: 142px;
      display: grid;
      gap: 7px;
      justify-items: center;
      padding: 9px 10px 10px;
      border: 1px solid rgba(160, 173, 235, .19);
      border-radius: 12px;
      background: rgba(8, 11, 28, .82);
      backdrop-filter: blur(8px);
    }
    .map-label { color: #9aa4c2; font-size: 8px; font-weight: 900; letter-spacing: .2em; }
    #map { display: block; width: 128px; height: 108px; }
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 13px;
      height: 13px;
      border: 1px solid rgba(137, 255, 247, .65);
      border-radius: 50%;
      box-shadow: 0 0 13px rgba(91, 246, 232, .5);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .toast {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 24px;
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      border: 1px solid rgba(115, 245, 236, .32);
      border-radius: 999px;
      color: #eaffff;
      background: rgba(8, 11, 28, .9);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .38);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity .16s ease, transform .16s ease;
      pointer-events: none;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    .overlay {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      overflow-y: auto;
      padding: 22px;
      background: rgba(5, 7, 18, .82);
      backdrop-filter: blur(9px);
    }
    .overlay[hidden] { display: none; }
    .panel {
      width: min(510px, 100%);
      max-height: calc(100vh - 44px);
      overflow-y: auto;
      padding: clamp(24px, 5vw, 40px);
      border: 1px solid rgba(141, 156, 238, .32);
      border-radius: 20px;
      background: #11152d;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .66), 0 0 60px rgba(128, 87, 255, .16);
      text-align: center;
    }
    .eyebrow { margin: 0 0 13px; color: #7ef4e9; font-size: 9px; font-weight: 950; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(42px, 9vw, 72px); line-height: .9; letter-spacing: -.075em; }
    h1 span { color: #a78aff; }
    .description { max-width: 400px; margin: 18px auto 21px; color: #b6bed7; font-size: 14px; line-height: 1.7; }
    .rules {
      display: grid;
      gap: 9px;
      margin: 0 auto 20px;
      padding: 14px 16px;
      border: 1px solid rgba(158, 171, 235, .15);
      border-radius: 12px;
      color: #c4cce1;
      background: rgba(121, 135, 205, .07);
      font-size: 11px;
      line-height: 1.5;
      text-align: left;
    }
    .rules b { color: #f4f4ff; }
    .step { margin: 0 0 15px; color: #8793b5; font-size: 9px; font-weight: 900; letter-spacing: .18em; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .actions button {
      min-width: 178px;
      min-height: 48px;
      padding: 13px 19px;
      border: 0;
      border-radius: 10px;
      color: #101126;
      background: linear-gradient(110deg, #84f6e8, #bba3ff);
      box-shadow: 0 8px 26px rgba(132, 246, 232, .22);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .13em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .actions button:hover { transform: translateY(-2px); box-shadow: 0 11px 32px rgba(160, 139, 255, .32); }
    .actions button:focus-visible, .touch-controls button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    .actions button.secondary { color: #e0e5f5; border: 1px solid rgba(162, 175, 233, .26); background: rgba(255, 255, 255, .055); box-shadow: none; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 13px 4px 0;
      color: #8994b3;
      font-size: 10px;
      line-height: 1.6;
    }
    .controls strong { color: #dce2f5; font-weight: 900; }
    .controls-tip { color: #7783a5; text-align: right; }
    .touch-controls { display: none; }

    @media (max-width: 650px) {
      body { padding: 12px 9px; }
      .topline { margin: 0 3px 9px; }
      .brand-mark { width: 35px; height: 35px; border-radius: 10px; }
      .brand-name { font-size: 12px; }
      .brand-subtitle { font-size: 7px; }
      .edition { font-size: 8px; }
      .stage { border-radius: 12px; }
      .hud { inset: 9px 8px auto; gap: 6px; }
      .hud-card { gap: 8px; padding: 8px 9px; }
      .hud-item { min-width: 39px; }
      .hud-label { font-size: 7px; }
      .hud-value { font-size: 12px; }
      .minimap { width: 104px; min-height: 91px; gap: 4px; padding: 6px; }
      #map { width: 84px; height: 70px; }
      .controls { align-items: flex-start; font-size: 8px; }
      .controls-tip { max-width: 38%; }
      .touch-controls { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
      .touch-controls button {
        min-width: 45px;
        min-height: 42px;
        border: 1px solid rgba(143, 160, 235, .25);
        border-radius: 10px;
        color: #e6ecff;
        background: rgba(105, 117, 184, .14);
        font-size: 13px;
        font-weight: 900;
        touch-action: none;
      }
      .panel { padding: 23px 18px; }
      .description { margin: 12px auto 16px; font-size: 12px; }
      .rules { gap: 7px; padding: 11px 12px; font-size: 10px; }
      .actions button { min-width: 155px; }
    }
    @media (max-height: 560px) {
      body { padding-top: 10px; padding-bottom: 10px; }
      .panel { padding: 17px 20px; }
      h1 { font-size: clamp(34px, 8vh, 52px); }
      .description { margin: 9px auto 11px; }
      .rules { gap: 5px; margin-bottom: 11px; padding: 9px 12px; }
      .step { margin-bottom: 10px; }
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">⌘</span>
        <div><span class="brand-name">Maze Craze</span><span class="brand-subtitle">THE NEON LABYRINTH</span></div>
      </div>
      <div class="edition" id="edition">MAZE 01 / 03</div>
    </header>

    <section class="stage" aria-label="Maze Craze first-person maze">
      <canvas id="scene" width="960" height="600" aria-label="First-person view of a neon maze. Find five prism keys and reach the portal."></canvas>
      <div class="hud" id="hud" hidden>
        <div class="hud-card" aria-live="polite">
          <div class="hud-item"><span class="hud-label">Maze</span><span class="hud-value" id="hud-level">01 / 03</span></div>
          <div class="hud-item"><span class="hud-label">Prism keys</span><span class="hud-value key-count" id="hud-keys">0 / 5</span></div>
        </div>
        <div class="minimap"><span class="map-label">YOUR MAP</span><canvas id="map" width="128" height="108" aria-label="Maze map"></canvas></div>
      </div>
      <div class="crosshair" id="crosshair" hidden aria-hidden="true"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="title">
        <div class="panel">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title"></h1>
          <p class="description" id="description"></p>
          <div class="rules" id="rules"></div>
          <p class="step" id="step"></p>
          <div class="actions" id="actions"></div>
        </div>
      </div>
    </section>

    <footer class="controls">
      <div><strong>W / UP</strong> forward · <strong>S / DOWN</strong> back<br><strong>A / LEFT</strong> turn left · <strong>D / RIGHT</strong> turn right · <strong>P</strong> pause</div>
      <div class="controls-tip">Find five prism keys.<br>Unlock the portal to escape.</div>
    </footer>
    <nav class="touch-controls" aria-label="Touch controls">
      <button type="button" data-move="left" aria-label="Turn left">◀</button>
      <button type="button" data-move="forward" aria-label="Move forward">▲</button>
      <button type="button" data-move="back" aria-label="Move backward">▼</button>
      <button type="button" data-move="right" aria-label="Turn right">▶</button>
    </nav>
  </main>

  <script>
    (() => {
      "use strict";

      const VIEW_W = 960;
      const VIEW_H = 600;
      const FOV = Math.PI / 2.9;
      const MAX_RAY = 24;
      const LEVELS = 3;
      const KEYS_PER_MAZE = 5;
      const PALETTES = [
        { wall: [77, 78, 161], trim: [126, 116, 255], glow: "#8f83ff", floor: [27, 38, 68] },
        { wall: [39, 115, 135], trim: [83, 227, 208], glow: "#68f0df", floor: [22, 52, 67] },
        { wall: [133, 69, 135], trim: [255, 123, 194], glow: "#ff81c5", floor: [55, 33, 72] }
      ];
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const mapCanvas = document.getElementById("map");
      const mapCtx = mapCanvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const eyebrowEl = document.getElementById("eyebrow");
      const titleEl = document.getElementById("title");
      const descriptionEl = document.getElementById("description");
      const rulesEl = document.getElementById("rules");
      const stepEl = document.getElementById("step");
      const actionsEl = document.getElementById("actions");
      const hud = document.getElementById("hud");
      const crosshair = document.getElementById("crosshair");
      const toastEl = document.getElementById("toast");
      const keys = new Set();
      const touchInputs = new Set();
      const zBuffer = new Float32Array(VIEW_W);
      const state = {
        mode: "title",
        level: 1,
        grid: [],
        size: 0,
        player: { x: 1.5, y: 1.5, angle: 0 },
        collectibles: [],
        exit: { x: 0, y: 0 },
        seen: [],
        collected: 0,
        toastRemaining: 0,
        exitHintCooldown: 0,
        animationTime: 0,
        lastFrame: 0
      };

      function rngFrom(seed) {
        let value = seed >>> 0;
        return () => {
          value = (value * 1664525 + 1013904223) >>> 0;
          return value / 4294967296;
        };
      }

      function generateMaze(level) {
        const size = 17 + level * 4;
        const grid = Array.from({ length: size }, () => Array(size).fill(1));
        const random = rngFrom(9371 + level * 7283);
        const start = { x: 1, y: 1 };
        const stack = [start];
        grid[start.y][start.x] = 0;

        while (stack.length) {
          const current = stack[stack.length - 1];
          const options = [[0, -2], [2, 0], [0, 2], [-2, 0]]
            .filter(([dx, dy]) => {
              const nx = current.x + dx;
              const ny = current.y + dy;
              return nx > 0 && ny > 0 && nx < size - 1 && ny < size - 1 && grid[ny][nx] === 1;
            });
          if (!options.length) {
            stack.pop();
            continue;
          }
          const [dx, dy] = options[Math.floor(random() * options.length)];
          grid[current.y + dy / 2][current.x + dx / 2] = 0;
          grid[current.y + dy][current.x + dx] = 0;
          stack.push({ x: current.x + dx, y: current.y + dy });
        }

        const distances = new Map([[`${start.x},${start.y}`, 0]]);
        const queue = [start];
        for (let i = 0; i < queue.length; i++) {
          const cell = queue[i];
          const distance = distances.get(`${cell.x},${cell.y}`);
          for (const [dx, dy] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
            const x = cell.x + dx;
            const y = cell.y + dy;
            const id = `${x},${y}`;
            if (grid[y]?.[x] === 0 && !distances.has(id)) {
              distances.set(id, distance + 1);
              queue.push({ x, y });
            }
          }
        }

        const farthest = queue.slice(1).sort((a, b) =>
          distances.get(`${b.x},${b.y}`) - distances.get(`${a.x},${a.y}`)
        );
        const exit = farthest[0];
        const maxDistance = distances.get(`${exit.x},${exit.y}`);
        const candidates = queue.slice(1).filter(cell =>
          cell.x !== exit.x || cell.y !== exit.y
        );
        const collectibles = [];
        for (const fraction of [.12, .29, .46, .64, .82]) {
          const target = maxDistance * fraction;
          const index = candidates.reduce((best, cell, i) => {
            const distance = distances.get(`${cell.x},${cell.y}`);
            return Math.abs(distance - target) < Math.abs(distances.get(`${candidates[best].x},${candidates[best].y}`) - target) ? i : best;
          }, 0);
          collectibles.push(candidates.splice(index, 1)[0]);
        }
        return { grid, size, exit, collectibles };
      }

      function revealMap() {
        const px = Math.floor(state.player.x);
        const py = Math.floor(state.player.y);
        for (let y = py - 2; y <= py + 2; y++) {
          for (let x = px - 2; x <= px + 2; x++) {
            if (state.grid[y]?.[x] !== undefined && Math.hypot(x - px, y - py) <= 2.8) state.seen[y][x] = true;
          }
        }
      }

      function updateHud() {
        const levelText = `${String(state.level).padStart(2, "0")} / ${String(LEVELS).padStart(2, "0")}`;
        document.getElementById("edition").textContent = `MAZE ${levelText}`;
        document.getElementById("hud-level").textContent = levelText;
        document.getElementById("hud-keys").textContent = `${state.collected} / ${KEYS_PER_MAZE}`;
        drawMap();
      }

      function setOverlay(mode, eyebrow, heading, description, rules, step, buttons) {
        state.mode = mode;
        overlay.hidden = false;
        eyebrowEl.textContent = eyebrow;
        titleEl.innerHTML = heading;
        descriptionEl.textContent = description;
        rulesEl.replaceChildren();
        if (rules) {
          for (const line of rules) {
            const item = document.createElement("div");
            item.innerHTML = line;
            rulesEl.appendChild(item);
          }
        }
        stepEl.textContent = step;
        actionsEl.replaceChildren();
        for (const [label, action, secondary] of buttons) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = label;
          if (secondary) button.className = "secondary";
          button.addEventListener("click", action);
          actionsEl.appendChild(button);
        }
        actionsEl.querySelector("button")?.focus();
      }

      function showTitle() {
        document.title = "Maze Craze";
        setOverlay(
          "title",
          "A FIRST-PERSON NEON MAZE",
          "MAZE<br><span>CRAZE</span>",
          "Survive three enormous labyrinths. Find five prism keys in each, use your map to retrace the corridors, and reach the portal at your own pace.",
          [
              "<b>W / Up and S / Down</b> move forward and back",
              "<b>A / Left and D / Right</b> turn through the corridors",
              "<b>Explore</b> — only nearby corridors appear on your map",
              `<b>Escape</b> — collect ${KEYS_PER_MAZE} keys, then find the portal`
          ],
          "THREE MAZES  /  ONE WAY OUT",
          [["Enter the maze", startRun]]
        );
        hud.hidden = true;
        crosshair.hidden = true;
      }

      function showPause() {
        setOverlay(
          "paused",
          `MAZE ${String(state.level).padStart(2, "0")}  /  PAUSED`,
          "TAKE A<br><span>BREATHER</span>",
          "The labyrinth is frozen. Your keys are safe.",
          null,
          `${state.collected} OF ${KEYS_PER_MAZE} PRISM KEYS`,
          [["Resume", resumeGame], ["Restart maze", () => beginLevel(state.level), true], ["Restart run", startRun, true]]
        );
      }

      function showLevelComplete() {
        if (state.level >= LEVELS) {
          setOverlay(
            "won",
            "THE PORTAL IS OPEN",
            "MAZE<br><span>MASTER</span>",
            "You found every key and escaped all three labyrinths. The maze is yours.",
            null,
            "RUN COMPLETE",
            [["Play again", startRun]]
          );
          return;
        }
        setOverlay(
          "between",
          "PORTAL SYNCHRONIZED",
          "MAZE <span>ESCAPED</span>",
          `Maze ${state.level} is behind you. The next labyrinth is larger, stranger, and waiting.`,
          null,
          `${state.level} OF ${LEVELS} MAZES CLEARED`,
          [[`Enter maze ${state.level + 1}`, () => beginLevel(state.level + 1)]]
        );
      }

      function beginLevel(level) {
        state.level = level;
        const maze = generateMaze(level);
        state.grid = maze.grid;
        state.size = maze.size;
        state.exit = maze.exit;
        state.collectibles = maze.collectibles.map(cell => ({ ...cell, collected: false }));
        state.collected = 0;
        state.player = {
          x: 1.5,
          y: 1.5,
          angle: state.grid[1][2] === 0 ? 0 : Math.PI / 2
        };
        state.seen = Array.from({ length: state.size }, () => Array(state.size).fill(false));
        state.exitHintCooldown = 0;
        state.toastRemaining = 0;
        toastEl.classList.remove("visible");
        revealMap();
        updateHud();
        hud.hidden = false;
        crosshair.hidden = false;
        overlay.hidden = true;
        state.mode = "playing";
        keys.clear();
        touchInputs.clear();
      }

      function startRun() {
        state.level = 1;
        beginLevel(1);
      }

      function resumeGame() {
        overlay.hidden = true;
        state.mode = "playing";
        keys.clear();
      }

      function canStand(x, y) {
        const radius = .2;
        const offsets = [[-radius, -radius], [radius, -radius], [-radius, radius], [radius, radius]];
        return offsets.every(([dx, dy]) => state.grid[Math.floor(y + dy)]?.[Math.floor(x + dx)] === 0);
      }

      function movePlayer(dx, dy) {
        const nextX = state.player.x + dx;
        const nextY = state.player.y + dy;
        if (canStand(nextX, state.player.y)) state.player.x = nextX;
        if (canStand(state.player.x, nextY)) state.player.y = nextY;
        revealMap();
        collectKeys();
        checkExit();
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("visible");
        state.toastRemaining = 2;
      }

      function collectKeys() {
        for (const key of state.collectibles) {
          if (!key.collected && Math.hypot(state.player.x - (key.x + .5), state.player.y - (key.y + .5)) < .48) {
            key.collected = true;
            state.collected += 1;
            updateHud();
            showToast(`Prism key found! ${state.collected} of ${KEYS_PER_MAZE}`);
          }
        }
      }

      function checkExit() {
        if (Math.hypot(state.player.x - (state.exit.x + .5), state.player.y - (state.exit.y + .5)) >= .56) return;
        if (state.collected < KEYS_PER_MAZE) {
          if (state.exitHintCooldown <= 0) {
            showToast(`Portal locked — find ${KEYS_PER_MAZE - state.collected} more keys`);
            state.exitHintCooldown = 1.6;
          }
          return;
        }
        state.mode = "between";
        showLevelComplete();
      }

      function keyboardInput(positive, negative) {
        return positive.some(key => keys.has(key) || touchInputs.has(key)) - negative.some(key => keys.has(key) || touchInputs.has(key));
      }

      function update(dt) {
        state.animationTime += dt;
        if (state.mode !== "playing") return;
        state.exitHintCooldown = Math.max(0, state.exitHintCooldown - dt);
        state.toastRemaining = Math.max(0, state.toastRemaining - dt);
        if (state.toastRemaining === 0) toastEl.classList.remove("visible");
        updateHud();
        const turn = keyboardInput(["d", "arrowright", "right"], ["a", "arrowleft", "left"]);
        const forward = keyboardInput(["w", "arrowup", "forward"], ["s", "arrowdown", "back"]);
        state.player.angle += turn * 2.35 * dt;
        const distance = forward * 2.35 * dt;
        if (distance) {
          movePlayer(Math.cos(state.player.angle) * distance, Math.sin(state.player.angle) * distance);
        }
      }

      function drawFloorAndCeiling() {
        const palette = PALETTES[(state.level - 1) % PALETTES.length];
        const horizon = VIEW_H * .49;
        const sky = ctx.createLinearGradient(0, 0, 0, horizon);
        sky.addColorStop(0, "#10142b");
        sky.addColorStop(1, "#222041");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, VIEW_W, horizon);
        const floor = ctx.createLinearGradient(0, horizon, 0, VIEW_H);
        floor.addColorStop(0, `rgb(${palette.floor[0]},${palette.floor[1]},${palette.floor[2]})`);
        floor.addColorStop(1, "#090d1c");
        ctx.fillStyle = floor;
        ctx.fillRect(0, horizon, VIEW_W, VIEW_H - horizon);

        ctx.save();
        ctx.strokeStyle = `rgba(${palette.trim.join(",")},.13)`;
        ctx.lineWidth = 1;
        for (let i = 1; i <= 12; i++) {
          const y = horizon + (VIEW_H - horizon) * (i / (i + 2));
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(VIEW_W, y);
          ctx.stroke();
        }
        ctx.strokeStyle = `rgba(${palette.trim.join(",")},.07)`;
        for (let i = -8; i <= 8; i++) {
          ctx.beginPath();
          ctx.moveTo(VIEW_W / 2, horizon);
          ctx.lineTo(VIEW_W / 2 + i * 95, VIEW_H);
          ctx.stroke();
        }
        ctx.restore();
      }

      function castWalls() {
        const palette = PALETTES[(state.level - 1) % PALETTES.length];
        const focal = VIEW_W / (2 * Math.tan(FOV / 2));
        const horizon = VIEW_H * .49 + Math.sin(state.animationTime * 7) * 1.5;
        for (let x = 0; x < VIEW_W; x += 2) {
          const angle = state.player.angle + (x / VIEW_W - .5) * FOV;
          const rayX = Math.cos(angle);
          const rayY = Math.sin(angle);
          let mapX = Math.floor(state.player.x);
          let mapY = Math.floor(state.player.y);
          const deltaX = Math.abs(1 / (rayX || .00001));
          const deltaY = Math.abs(1 / (rayY || .00001));
          const stepX = rayX < 0 ? -1 : 1;
          const stepY = rayY < 0 ? -1 : 1;
          let sideX = rayX < 0 ? (state.player.x - mapX) * deltaX : (mapX + 1 - state.player.x) * deltaX;
          let sideY = rayY < 0 ? (state.player.y - mapY) * deltaY : (mapY + 1 - state.player.y) * deltaY;
          let side = 0;
          let distance = 0;
          for (let step = 0; step < 80; step++) {
            if (sideX < sideY) {
              sideX += deltaX;
              mapX += stepX;
              side = 0;
            } else {
              sideY += deltaY;
              mapY += stepY;
              side = 1;
            }
            distance = side === 0 ? sideX - deltaX : sideY - deltaY;
            if (distance > MAX_RAY || state.grid[mapY]?.[mapX] !== 0) break;
          }
          const corrected = Math.max(.05, distance * Math.cos(angle - state.player.angle));
          zBuffer[x] = corrected;
          zBuffer[x + 1] = corrected;
          const wallHeight = Math.min(VIEW_H * 2, focal / corrected);
          const top = horizon - wallHeight / 2;
          const texture = side === 0 ? state.player.y + distance * rayY : state.player.x + distance * rayX;
          const seam = Math.floor((texture - Math.floor(texture)) * 8);
          const attenuation = Math.max(.18, 1 - corrected / (MAX_RAY * 1.05)) * (side ? .72 : 1);
          const stripe = seam === 0 ? 1.25 : seam % 4 === 0 ? .9 : 1;
          const red = Math.round(palette.wall[0] * attenuation * stripe);
          const green = Math.round(palette.wall[1] * attenuation * stripe);
          const blue = Math.round(palette.wall[2] * attenuation * stripe);
          ctx.fillStyle = `rgb(${red},${green},${blue})`;
          ctx.fillRect(x, top, 2, wallHeight);
          if (seam === 0 && corrected < 8) {
            ctx.fillStyle = `rgba(${palette.trim.join(",")},${Math.max(.03, .15 - corrected * .015)})`;
            ctx.fillRect(x, top, 2, wallHeight);
          }
          if (wallHeight > 15) {
            ctx.fillStyle = `rgba(255,255,255,${.025 * attenuation})`;
            ctx.fillRect(x, top, 2, Math.max(1, wallHeight * .025));
          }
        }
      }

      function angleDifference(angle) {
        let difference = angle - state.player.angle;
        while (difference < -Math.PI) difference += Math.PI * 2;
        while (difference > Math.PI) difference -= Math.PI * 2;
        return difference;
      }

      function drawSpark(x, y, radius, rotation, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -radius);
        ctx.quadraticCurveTo(radius * .12, -radius * .12, radius, 0);
        ctx.quadraticCurveTo(radius * .12, radius * .12, 0, radius);
        ctx.quadraticCurveTo(-radius * .12, radius * .12, -radius, 0);
        ctx.quadraticCurveTo(-radius * .12, -radius * .12, 0, -radius);
        ctx.fill();
        ctx.restore();
      }

      function drawPortal(size, unlocked) {
        const time = state.animationTime;
        const width = size * .42;
        const height = size * .56;
        const accent = unlocked ? "#ff9df5" : "#b88aff";
        const bright = unlocked ? "#fff0ff" : "#ecd9ff";
        const nebula = ctx.createRadialGradient(0, -size * .08, size * .03, 0, -size * .08, size * .78);
        nebula.addColorStop(0, unlocked ? "rgba(244,81,255,.48)" : "rgba(172,88,255,.4)");
        nebula.addColorStop(.38, "rgba(85,71,232,.28)");
        nebula.addColorStop(.72, "rgba(36,82,191,.16)");
        nebula.addColorStop(1, "rgba(14,17,49,0)");
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = nebula;
        ctx.beginPath();
        ctx.ellipse(0, -size * .08, size * .78, size * .76, Math.sin(time * .16) * .08, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.rotate(Math.sin(time * .32) * .035);
        ctx.strokeStyle = "rgba(103,143,255,.58)";
        ctx.lineWidth = Math.max(1, size * .012);
        ctx.beginPath();
        ctx.ellipse(0, -size * .06, size * .48, size * .65, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = "rgba(190,107,255,.72)";
        ctx.lineWidth = Math.max(1, size * .008);
        ctx.beginPath();
        ctx.ellipse(0, -size * .06, size * .42, size * .59, 0, .15, Math.PI * 1.82);
        ctx.stroke();
        ctx.restore();

        ctx.beginPath();
        ctx.moveTo(-width, size * .48);
        ctx.lineTo(-width, -size * .08);
        ctx.bezierCurveTo(-width, -size * .4, -width * .62, -height, 0, -height);
        ctx.bezierCurveTo(width * .62, -height, width, -size * .4, width, -size * .08);
        ctx.lineTo(width, size * .48);
        const arch = ctx.createLinearGradient(-width, 0, width, 0);
        arch.addColorStop(0, "#11152a");
        arch.addColorStop(.16, "#38334e");
        arch.addColorStop(.42, "#24233e");
        arch.addColorStop(.55, "#514466");
        arch.addColorStop(.82, "#302d49");
        arch.addColorStop(1, "#101426");
        ctx.shadowColor = "rgba(137,91,255,.82)";
        ctx.shadowBlur = Math.min(34, size * .13);
        ctx.strokeStyle = "#090d20";
        ctx.lineWidth = Math.max(5, size * .17);
        ctx.lineJoin = "round";
        ctx.stroke();
        ctx.strokeStyle = arch;
        ctx.lineWidth = Math.max(4, size * .135);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(183,153,222,.48)";
        ctx.lineWidth = Math.max(1, size * .012);
        ctx.stroke();

        for (const side of [-1, 1]) {
          for (let i = 0; i < 4; i++) {
            const y = size * (-.22 + i * .17);
            const x = side * width * .73;
            ctx.strokeStyle = i % 2 ? "rgba(106,145,255,.74)" : "rgba(202,130,255,.8)";
            ctx.lineWidth = Math.max(1, size * .012);
            ctx.beginPath();
            ctx.moveTo(x - size * .035, y - size * .02);
            ctx.lineTo(x + size * .025, y);
            ctx.lineTo(x - size * .035, y + size * .02);
            ctx.moveTo(x + size * .015, y - size * .033);
            ctx.lineTo(x + size * .015, y + size * .033);
            ctx.stroke();
            ctx.fillStyle = bright;
            ctx.beginPath();
            ctx.arc(x + size * .015, y, Math.max(1, size * .009), 0, Math.PI * 2);
            ctx.fill();
          }
        }

        const keystone = ctx.createLinearGradient(0, -height - size * .06, 0, -height + size * .04);
        keystone.addColorStop(0, "#70658e");
        keystone.addColorStop(.5, "#292943");
        keystone.addColorStop(1, "#14182e");
        ctx.fillStyle = keystone;
        ctx.strokeStyle = "rgba(197,152,255,.9)";
        ctx.lineWidth = Math.max(1, size * .012);
        ctx.beginPath();
        ctx.moveTo(0, -height - size * .055);
        ctx.lineTo(size * .065, -height);
        ctx.lineTo(0, -height + size * .055);
        ctx.lineTo(-size * .065, -height);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        drawSpark(0, -height, Math.max(2, size * .022), time, bright);

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(0, -size * .035, size * .285, size * .425, 0, 0, Math.PI * 2);
        ctx.clip();
        const opening = ctx.createRadialGradient(-size * .04, -size * .17, size * .012, 0, -size * .02, size * .48);
        opening.addColorStop(0, unlocked ? "#fff1ff" : "#f8dcff");
        opening.addColorStop(.1, unlocked ? "#ff8cf4" : "#e96bff");
        opening.addColorStop(.34, "#b52cff");
        opening.addColorStop(.62, "#6731d0");
        opening.addColorStop(.84, "#332a91");
        opening.addColorStop(1, "#10132d");
        ctx.fillStyle = opening;
        ctx.fillRect(-size * .32, -size * .5, size * .64, size * .94);

        const swirlColors = ["rgba(255,170,255,.86)", "rgba(157,157,255,.82)", "rgba(104,195,255,.72)"];
        for (let ribbon = 0; ribbon < 3; ribbon++) {
          ctx.beginPath();
          for (let i = 0; i <= 56; i++) {
            const progress = i / 56;
            const x = (progress - .5) * size * .52;
            const envelope = Math.sin(progress * Math.PI);
            const y = -size * .035 + Math.sin(progress * Math.PI * 5 + time * (ribbon % 2 ? -.8 : .8) + ribbon * 2.1) * size * .21 * envelope;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = swirlColors[ribbon];
          ctx.lineWidth = Math.max(1, size * .014);
          ctx.stroke();
        }

        for (let spiral = 0; spiral < 2; spiral++) {
          ctx.beginPath();
          for (let i = 0; i <= 72; i++) {
            const progress = i / 72;
            const angle = progress * Math.PI * 5 + time * (spiral ? -.9 : .9) + spiral * Math.PI;
            const radius = size * (.015 + progress * .23);
            const x = Math.cos(angle) * radius * .8;
            const y = -size * .035 + Math.sin(angle) * radius * 1.15;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = spiral ? "rgba(255,220,255,.78)" : "rgba(157,169,255,.84)";
          ctx.lineWidth = Math.max(1, size * .012);
          ctx.stroke();
        }

        for (let i = 0; i < 12; i++) {
          const angle = time * (i % 2 ? -.4 : .55) + i * 2.4;
          const radius = size * (.08 + (i % 4) * .045);
          drawSpark(Math.cos(angle) * radius, -size * .035 + Math.sin(angle) * radius * 1.45, Math.max(1.5, size * .012), angle, i % 2 ? "#f7e6ff" : "#ff9af1");
        }
        ctx.restore();

        ctx.shadowColor = accent;
        ctx.shadowBlur = Math.min(18, size * .1);
        if (unlocked) {
          drawSpark(0, -size * .02, Math.max(3, size * .07), time * .8, bright);
        } else {
          ctx.fillStyle = "#f4ddff";
          ctx.font = `900 ${Math.max(10, size * .14)}px system-ui`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(`${KEYS_PER_MAZE - state.collected}`, 0, -size * .035);
        }
        ctx.shadowBlur = 0;

        for (let i = 0; i < 9; i++) {
          const angle = Math.PI + (i / 8) * Math.PI;
          const x = Math.cos(angle) * width * 1.04;
          const y = -size * .07 + Math.sin(angle) * height * .92;
          drawSpark(x, y, Math.max(2, size * (i % 2 ? .018 : .027)), time * .45 + i, i % 2 ? "#f7d7ff" : accent);
        }
        for (let i = 0; i < 8; i++) {
          const angle = time * .52 + i * Math.PI / 4;
          const x = Math.cos(angle) * size * .53;
          const y = -size * .04 + Math.sin(angle) * size * .65;
          drawSpark(x, y, Math.max(1.5, size * .014), -time + i, i % 2 ? "#d5e0ff" : accent);
        }
      }

      function drawSprites() {
        const focal = VIEW_W / (2 * Math.tan(FOV / 2));
        const sprites = state.collectibles.filter(item => !item.collected).map(item => ({ ...item, type: "key" }));
        sprites.push({ ...state.exit, type: "exit" });
        sprites.sort((a, b) =>
          Math.hypot(b.x + .5 - state.player.x, b.y + .5 - state.player.y) -
          Math.hypot(a.x + .5 - state.player.x, a.y + .5 - state.player.y)
        );
        for (const sprite of sprites) {
          const dx = sprite.x + .5 - state.player.x;
          const dy = sprite.y + .5 - state.player.y;
          const distance = Math.hypot(dx, dy);
          const difference = angleDifference(Math.atan2(dy, dx));
          if (Math.abs(difference) > FOV * .58 || distance < .25) continue;
          const screenX = VIEW_W / 2 + Math.tan(difference) * focal;
          const column = Math.max(0, Math.min(VIEW_W - 1, Math.floor(screenX)));
          if (distance > zBuffer[column]) continue;
          const size = focal / distance * (sprite.type === "exit" ? 1.15 : .48);
          const centerY = VIEW_H * .49 + size * (sprite.type === "exit" ? .4 : .16) + Math.sin(state.animationTime * 3 + sprite.x) * Math.min(8, size * .08);
          ctx.save();
          ctx.translate(screenX, centerY);
          if (sprite.type === "key") {
            const pulse = 1 + Math.sin(state.animationTime * 3.5 + sprite.y) * .035;
            ctx.scale(pulse, pulse);
            const metal = ctx.createLinearGradient(-size * .14, -size * .25, size * .16, size * .27);
            metal.addColorStop(0, "#fff6c1");
            metal.addColorStop(.2, "#ffe27a");
            metal.addColorStop(.47, "#c77b1c");
            metal.addColorStop(.68, "#ffdc67");
            metal.addColorStop(1, "#8f4e17");
            ctx.shadowColor = "#ffd45f";
            ctx.shadowBlur = Math.min(34, size * .24);
            ctx.strokeStyle = metal;
            ctx.lineWidth = Math.max(2, size * .075);
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(0, -size * .035);
            ctx.lineTo(0, size * .35);
            ctx.stroke();

            ctx.lineWidth = Math.max(2, size * .065);
            ctx.beginPath();
            ctx.arc(0, -size * .19, size * .145, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#17152a";
            ctx.beginPath();
            ctx.arc(0, -size * .19, size * .078, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,248,213,.92)";
            ctx.lineWidth = Math.max(1, size * .018);
            ctx.beginPath();
            ctx.arc(-size * .012, -size * .195, size * .105, Math.PI * 1.08, Math.PI * 1.78);
            ctx.stroke();

            ctx.fillStyle = metal;
            ctx.beginPath();
            ctx.moveTo(-size * .025, size * .15);
            ctx.lineTo(size * .13, size * .15);
            ctx.lineTo(size * .13, size * .215);
            ctx.lineTo(size * .04, size * .215);
            ctx.lineTo(size * .04, size * .255);
            ctx.lineTo(size * .115, size * .255);
            ctx.lineTo(size * .115, size * .32);
            ctx.lineTo(-size * .025, size * .32);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "rgba(255,246,194,.86)";
            ctx.lineWidth = Math.max(1, size * .014);
            ctx.beginPath();
            ctx.moveTo(size * .025, size * .025);
            ctx.lineTo(size * .025, size * .12);
            ctx.stroke();
            drawSpark(-size * .11, -size * .29, Math.max(1.5, size * .027), state.animationTime * 1.8, "#fff7d1");
          } else {
            const unlocked = state.collected >= KEYS_PER_MAZE;
            drawPortal(size, unlocked);
          }
          ctx.restore();
        }
      }

      function drawMap() {
        if (!state.grid.length || !mapCtx) return;
        const w = mapCanvas.width;
        const h = mapCanvas.height;
        mapCtx.clearRect(0, 0, w, h);
        const padding = 3;
        const cell = Math.min((w - padding * 2) / state.size, (h - padding * 2) / state.size);
        const mapW = cell * state.size;
        const mapH = cell * state.size;
        const ox = (w - mapW) / 2;
        const oy = (h - mapH) / 2;
        mapCtx.fillStyle = "#0b1021";
        mapCtx.fillRect(0, 0, w, h);
        for (let y = 0; y < state.size; y++) {
          for (let x = 0; x < state.size; x++) {
            if (!state.seen[y]?.[x]) continue;
            mapCtx.fillStyle = state.grid[y][x] === 1 ? "rgba(117,126,185,.48)" : "rgba(33,43,73,.86)";
            mapCtx.fillRect(ox + x * cell, oy + y * cell, Math.ceil(cell), Math.ceil(cell));
          }
        }
        for (const key of state.collectibles) {
          if (key.collected || !state.seen[key.y]?.[key.x]) continue;
          mapCtx.fillStyle = "#ffd26e";
          mapCtx.fillRect(ox + key.x * cell + cell * .25, oy + key.y * cell + cell * .25, cell * .5, cell * .5);
        }
        if (state.seen[state.exit.y]?.[state.exit.x]) {
          mapCtx.fillStyle = state.collected >= KEYS_PER_MAZE ? "#7ef4e9" : "#c2a4ff";
          mapCtx.fillRect(ox + state.exit.x * cell + cell * .18, oy + state.exit.y * cell + cell * .18, cell * .64, cell * .64);
        }
        const px = ox + state.player.x * cell;
        const py = oy + state.player.y * cell;
        mapCtx.save();
        mapCtx.translate(px, py);
        mapCtx.rotate(state.player.angle);
        mapCtx.fillStyle = "#85fff1";
        mapCtx.shadowColor = "#6bfff1";
        mapCtx.shadowBlur = 7;
        mapCtx.beginPath();
        mapCtx.moveTo(cell * .48, 0);
        mapCtx.lineTo(-cell * .35, -cell * .3);
        mapCtx.lineTo(-cell * .35, cell * .3);
        mapCtx.closePath();
        mapCtx.fill();
        mapCtx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, VIEW_W, VIEW_H);
        drawFloorAndCeiling();
        if (state.grid.length) {
          castWalls();
          drawSprites();
          drawMap();
        } else {
          ctx.fillStyle = "rgba(134,126,255,.14)";
          ctx.beginPath();
          ctx.arc(VIEW_W / 2, VIEW_H / 2, 70 + Math.sin(state.animationTime * 2) * 8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function frame(timestamp) {
        const dt = Math.min(.05, (timestamp - state.lastFrame) / 1000 || 0);
        state.lastFrame = timestamp;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", event => {
        const key = event.key.toLowerCase();
        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) event.preventDefault();
        keys.add(key);
        if (event.repeat) return;
        if ((key === "p" || key === "escape") && state.mode === "playing") showPause();
        else if ((key === "p" || key === "escape") && state.mode === "paused") resumeGame();
      });
      window.addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));
      window.addEventListener("blur", () => { keys.clear(); touchInputs.clear(); });
      document.querySelectorAll("[data-move]").forEach(button => {
        const direction = button.dataset.move;
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          touchInputs.add(direction);
          button.setPointerCapture(event.pointerId);
        });
        const release = () => touchInputs.delete(direction);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
        button.addEventListener("click", event => {
          if (event.detail !== 0 || state.mode !== "playing") return;
          if (direction === "left") state.player.angle -= .35;
          else if (direction === "right") state.player.angle += .35;
          else movePlayer(Math.cos(state.player.angle) * (direction === "forward" ? .35 : -.35), Math.sin(state.player.angle) * (direction === "forward" ? .35 : -.35));
        });
      });

      showTitle();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
